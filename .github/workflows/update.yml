name: Update data

on:
  schedule:
    # 1st-5th of each month, after the 10:00 a.m. ET Census release
    - cron: "37 15 1-5 * *"
    - cron: "37 18 1-5 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch, parse and check, but commit nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Fetch, check and rebuild
        id: update
        run: |
          args=(--commit-msg "$RUNNER_TEMP/commit-msg.txt")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/update.py "${args[@]}"

      - name: Commit
        if: steps.update.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_NAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo "Repository variables COMMIT_NAME and COMMIT_EMAIL must be set." >&2
            exit 1
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add index.html data/summary.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push

      - name: Flag large revisions
        if: steps.update.outputs.big_revisions == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The data update for this run moved at least one stored value by more than 5%."
            echo "The commit message lists each move. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Large revision in construction spending data" --body-file "$RUNNER_TEMP/issue.md"

      - name: Open or comment on issue
        if: failure() && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data update needs attention
        run: |
          echo "The scheduled data update failed. No changes were committed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/issue.md"
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
